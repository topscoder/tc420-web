<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TC420 Web</title>
    <meta
      name="description"
      content="Edit the lighting schedules of a TC420 LED controller and send them over USB, without internet or other software."
    />
    <meta name="theme-color" content="#1f3a68" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main>
      <header class="top">
        <div class="top-inner">
          <h1>
            <svg
              class="logo"
              aria-hidden="true"
              width="28"
              height="28"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 32 32"
            >
              <rect width="32" height="32" rx="7" fill="#1f3a68" />
              <g fill="#ffcc4d">
                <rect x="4.5" y="18" width="3" height="8" rx="1.2" />
                <rect x="9.5" y="12" width="3" height="14" rx="1.2" />
                <rect x="14.5" y="6" width="3" height="20" rx="1.2" />
                <rect x="19.5" y="12" width="3" height="14" rx="1.2" />
                <rect x="24.5" y="18" width="3" height="8" rx="1.2" />
              </g>
            </svg>
            <span data-i18n="app.title">TC420 Web</span>
          </h1>
          <span class="status"><span class="dot" id="dot"></span><span id="status-text"></span></span>
          <span class="badge sim" id="sim-badge" data-i18n="header.sim" hidden></span>
          <select id="lang" data-i18n-attr="aria-label:header.language"></select>
          <div class="device-wrap">
            <button class="primary" id="btn-connect" aria-haspopup="menu" aria-expanded="false"></button>
            <div id="device-menu" class="menu" role="menu" hidden>
              <button role="menuitem" id="menu-clock"></button>
              <button role="menuitem" id="menu-clear" class="danger-text" data-i18n="device.menuClear"></button>
              <button role="menuitem" id="menu-disconnect" data-i18n="device.menuDisconnect"></button>
            </div>
          </div>
        </div>
      </header>

      <div id="unsupported" class="warn-box" role="status" hidden>
        <span id="unsupported-text"></span>
        <button class="small" id="btn-support-more" data-i18n="support.more"></button>
      </div>
      <div id="sim-note" class="sim-box" data-i18n-html="banner.sim" hidden></div>

      <p class="lead" data-i18n="main.intro"></p>

      <section class="card" id="programs-card">
        <div class="lib-grid">
          <div class="lib-side">
            <h2 data-i18n="t4.title"></h2>
            <p class="note" id="lib-status"></p>
            <div id="drop">
              <span data-i18n-html="t4.drop"></span><input id="file" type="file" accept=".tmf" multiple hidden />
            </div>
            <div class="row">
              <button id="btn-new-mode" data-i18n="t4.new"></button>
              <select id="template-select" data-i18n-attr="aria-label:templates.title"></select>
              <button id="btn-add-template" data-i18n="templates.add"></button>
            </div>
            <h3 id="list-title"></h3>
            <div class="modes" id="modes"></div>
            <div class="last" id="last-T4" role="status"></div>
          </div>
          <div class="lib-main">
            <div id="editor" hidden>
              <h3 id="editor-title"></h3>
              <div class="row">
                <label><input type="checkbox" id="link-channels" /> <strong data-i18n="editor.link"></strong></label>
                <span class="spacer"></span>
                <button id="btn-undo" data-i18n="editor.undo"></button>
                <button id="btn-redo" data-i18n="editor.redo"></button>
                <button id="btn-add-step" data-i18n="t4.addStep"></button>
                <button id="btn-export-tmf" data-i18n="t4.exportTmf"></button>
                <button
                  id="btn-preview"
                  aria-expanded="false"
                  aria-controls="preview-panel"
                  data-i18n="preview.open"
                ></button>
              </div>
              <div id="preview-panel" class="preview" role="region" data-i18n-attr="aria-label:preview.title" hidden>
                <div class="row">
                  <strong data-i18n="preview.title"></strong>
                  <span class="seg" role="radiogroup" data-i18n-attr="aria-label:preview.title">
                    <label
                      ><input type="radio" name="preview-mode" value="play" checked />
                      <span data-i18n="preview.modePlay"></span
                    ></label>
                    <label
                      ><input type="radio" name="preview-mode" value="manual" />
                      <span data-i18n="preview.modeManual"></span
                    ></label>
                  </span>
                  <span class="spacer"></span>
                  <span class="note" id="preview-state" role="status"></span>
                </div>
                <div id="preview-play">
                  <div class="row">
                    <span class="note" data-i18n="preview.dayIn"></span>
                    <span class="seg" role="radiogroup" data-i18n-attr="aria-label:preview.dayIn">
                      <label
                        ><input type="radio" name="preview-speed" value="1" /> <span data-i18n="preview.min1"></span
                      ></label>
                      <label
                        ><input type="radio" name="preview-speed" value="2" /> <span data-i18n="preview.min2"></span
                      ></label>
                      <label
                        ><input type="radio" name="preview-speed" value="5" /> <span data-i18n="preview.min5"></span
                      ></label>
                    </span>
                  </div>
                  <div class="row">
                    <button class="primary" id="btn-preview-play"></button>
                    <label class="grow"
                      ><span class="sr-only" data-i18n="preview.time"></span>
                      <input type="range" id="preview-time" min="0" max="1439" step="1" value="0"
                    /></label>
                    <output id="preview-clock" for="preview-time"></output>
                  </div>
                </div>
                <div id="preview-manual" hidden>
                  <div class="sliders" id="preview-sliders"></div>
                </div>
                <div class="row">
                  <button id="btn-preview-stop" data-i18n="preview.stop"></button>
                  <span class="note" data-i18n="preview.note"></span>
                </div>
              </div>
              <div class="row" id="channel-picker"></div>
              <ul class="warnings" id="editor-warnings"></ul>
              <p class="note warn-text" id="editor-message" role="status"></p>
              <div class="chart" id="editor-chart"></div>
              <div class="row">
                <span class="note" data-i18n="editor.chartHelp"></span>
                <span class="spacer"></span>
                <label class="note"><input type="checkbox" id="chart-zoom" /> <span data-i18n="t4.zoom"></span></label>
              </div>
              <div class="table-wrap"><table id="editor-table"></table></div>
              <details>
                <summary data-i18n="editor.channels"></summary>
                <div id="channel-fields"></div>
              </details>
            </div>
          </div>
        </div>
      </section>

      <section class="card" id="send-card">
        <h2 data-i18n="t5.title"></h2>
        <p id="t5-text"></p>
        <div class="row">
          <button class="danger" id="btn-download"></button>
          <span class="progress" id="dl-progress"></span>
          <button id="btn-backup-after" data-i18n="t5.exportBackup" hidden></button>
        </div>
        <p class="note" data-i18n="t4.noReadBack"></p>
      </section>

      <details class="card fold" id="settings">
        <summary><h2 data-i18n="settings.title"></h2></summary>
        <h3 data-i18n="settings.backupTitle"></h3>
        <div class="row">
          <button id="btn-export-backup" data-i18n="t4.exportBackup"></button>
          <button id="btn-restore-backup" data-i18n="t4.restoreBackup"></button>
          <input id="backup-file" type="file" accept=".json,application/json" hidden />
        </div>
        <h3 data-i18n="pwa.title"></h3>
        <p><strong id="offline-status"></strong></p>
        <p class="note" id="install-hint" data-i18n="pwa.installHint"></p>
        <div class="row"><button class="primary" id="btn-install" data-i18n="pwa.install" hidden></button></div>
        <h3 data-i18n="settings.controllerTitle"></h3>
        <p>
          <label><input type="checkbox" id="setting-multiple" /> <span data-i18n="t5.multiple"></span></label>
          <br /><span class="note" data-i18n="t5.multipleHint"></span>
        </p>
        <h3 data-i18n="about.title"></h3>
        <p class="note" data-i18n-html="about.license"></p>
        <p class="note" data-i18n="about.disclaimer"></p>
        <p class="note" data-i18n="about.privacy"></p>
        <p class="note" data-i18n-html="about.credits"></p>
      </details>

      <details class="card fold" id="advanced">
        <summary><h2 data-i18n="adv.title"></h2></summary>
        <p class="note" data-i18n="adv.text"></p>
        <p class="note" id="app-version"></p>

        <h3 data-i18n="adv.reportTitle"></h3>
        <p data-i18n-html="adv.reportText"></p>

        <h3 data-i18n="log.title"></h3>
        <p class="note" id="log-count"></p>
        <div id="log" role="log" tabindex="0" data-i18n-attr="aria-label:log.title"></div>
        <div class="row">
          <button id="btn-export-json" data-i18n="header.exportJson"></button>
          <button id="btn-export-txt" data-i18n="header.exportTxt"></button>
          <button id="btn-new-session" data-i18n="log.newSession"></button>
          <button id="btn-clear-log" data-i18n="log.clear"></button>
        </div>
        <div class="obs">
          <span class="note" data-i18n="obs.label"></span>
          <input type="text" id="obs-note" data-i18n-attr="placeholder:obs.placeholder" />
          <button class="small" id="obs-ok" data-i18n="obs.works"></button>
          <button class="small" id="obs-bad" data-i18n="obs.fails"></button>
          <span class="saved" id="obs-saved"></span>
        </div>
        <p class="note" data-i18n-html="log.note"></p>

        <h3 data-i18n="support.advTitle"></h3>
        <p class="note" id="platform-info"></p>
        <div class="row">
          <button id="btn-support-adv" data-i18n="support.more"></button>
          <button id="btn-linux-adv" data-i18n="linux.open"></button>
        </div>

        <h3 data-i18n="adv.simTitle"></h3>
        <p>
          <label><input type="checkbox" id="setting-sim" /> <span data-i18n="adv.sim"></span></label>
          <br /><span class="note" data-i18n="adv.simHint"></span>
        </p>

        <h3 data-i18n="t3.title"></h3>
        <p data-i18n-html="t3.text"></p>
        <div class="row">
          <label
            ><span data-i18n="t3.name"></span> <input type="text" id="play-name" value="TEST" maxlength="8" size="9"
          /></label>
          <button class="primary needs-device" id="btn-play-start" data-i18n="t3.start"></button>
          <button class="needs-device" id="btn-play-stop" data-i18n="t3.stop" disabled></button>
          <span class="progress note" id="play-stats"></span>
        </div>
        <div class="sliders" id="sliders"></div>
        <div class="row">
          <button class="needs-play" id="btn-all-0" data-i18n="t3.all0" disabled></button>
          <button class="needs-play" id="btn-all-100" data-i18n="t3.all100" disabled></button>
          <button class="needs-play" id="btn-sweep" data-i18n="t3.sweep" disabled></button>
          <label class="note"><input type="checkbox" id="verbose" /> <span data-i18n="t3.verbose"></span></label>
        </div>
        <div class="last" id="last-T3"></div>

        <h3 data-i18n="adv.testTitle"></h3>
        <p class="note" data-i18n="t4.testExplain"></p>
        <div class="row"><button id="btn-test-mode" data-i18n="t4.testMode"></button></div>

        <h3 data-i18n="t7.title"></h3>
        <p class="note" data-i18n="t7.text"></p>
        <div class="row">
          <label><span data-i18n="t7.cmd"></span> <input type="text" id="raw-cmd" value="11" size="4" /></label>
          <label
            ><span data-i18n="t7.payload"></span>
            <input type="text" id="raw-payload" value="" size="40" data-i18n-attr="placeholder:t7.payloadPlaceholder"
          /></label>
          <label class="note"
            ><input type="checkbox" id="raw-expect" checked /> <span data-i18n="t7.expect"></span
          ></label>
          <button class="needs-device" id="btn-raw" data-i18n="t7.send"></button>
        </div>
        <div class="last" id="last-T7"></div>
      </details>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
      <span id="toast-text"></span>
      <div class="row" id="toast-actions"></div>
    </div>

    <dialog id="dlg-connect" aria-labelledby="dlg-connect-title">
      <h2 id="dlg-connect-title" data-i18n="device.helpTitle"></h2>
      <p data-i18n-html="device.helpText"></p>
      <div class="row end">
        <button id="dlg-connect-cancel" data-i18n="common.cancel"></button>
        <button class="primary" id="dlg-connect-ok" data-i18n="device.helpContinue"></button>
      </div>
    </dialog>

    <dialog id="dlg-clear" aria-labelledby="dlg-clear-title">
      <h2 id="dlg-clear-title" data-i18n="device.clearTitle"></h2>
      <p data-i18n="device.clearText"></p>
      <div class="row end">
        <button id="dlg-clear-cancel" data-i18n="common.cancel"></button>
        <button class="danger" id="dlg-clear-ok" data-i18n="device.clearConfirm"></button>
      </div>
    </dialog>

    <dialog id="dlg-support" aria-labelledby="dlg-support-title">
      <h2 id="dlg-support-title" data-i18n="support.title"></h2>
      <p data-i18n="support.intro"></p>
      <ul>
        <li data-i18n-html="support.works"></li>
        <li data-i18n-html="support.notWorks"></li>
      </ul>
      <p data-i18n-html="support.os"></p>
      <p data-i18n="support.editing"></p>
      <div class="row end">
        <button id="dlg-support-linux" data-i18n="linux.open"></button>
        <button class="primary" id="dlg-support-close" data-i18n="common.close"></button>
      </div>
    </dialog>

    <dialog id="dlg-linux" aria-labelledby="dlg-linux-title">
      <h2 id="dlg-linux-title" data-i18n="linux.title"></h2>
      <p data-i18n="linux.text"></p>
      <pre class="commands" id="linux-commands"></pre>
      <p data-i18n="linux.after"></p>
      <p class="note" data-i18n="linux.packaged"></p>
      <div class="row end">
        <span class="note" id="linux-copied" role="status"></span>
        <button id="btn-linux-copy" data-i18n="linux.copy"></button>
        <button class="primary" id="dlg-linux-close" data-i18n="common.close"></button>
      </div>
    </dialog>

    <dialog id="dlg-ask" aria-labelledby="dlg-ask-text">
      <p id="dlg-ask-text"></p>
      <div class="row end">
        <button id="dlg-ask-cancel" data-i18n="common.cancel"></button>
        <button id="dlg-ask-ok"></button>
      </div>
    </dialog>

    <dialog id="dlg-send" aria-labelledby="dlg-send-title">
      <h2 id="dlg-send-title"></h2>
      <div id="dlg-send-body"></div>
      <div class="row end" id="dlg-send-actions"></div>
    </dialog>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
